<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Green rounded background -->
  <rect width="100" height="100" rx="18" fill="#1B5E20"/>

  <!-- Flagpole -->
  <line x1="26" y1="12" x2="26" y2="88" stroke="white" stroke-width="5.5" stroke-linecap="round"/>
  <!-- Ball on top -->
  <circle cx="26" cy="12" r="4.5" fill="white"/>

  <!-- Flag swallowtail body -->
  <path d="M26,24 L78,31 C83,40 84,50 78,60 C84,60 83,70 78,78 L26,71 Z"
        fill="white" opacity="0.95"/>

  <!-- Red Q circle -->
  <circle cx="55" cy="51" r="19" fill="#E21F2F"/>

  <!-- Q: circle part (white ring) -->
  <circle cx="55" cy="50" r="9.5" fill="none" stroke="white" stroke-width="3.5"/>
  <!-- Q: tail -->
  <line x1="61.5" y1="56.5" x2="68" y2="64" stroke="white" stroke-width="4" stroke-linecap="round"/>
</svg>
