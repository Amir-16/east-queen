<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 60" fill="none">
  <!-- Flag pole -->
  <line x1="18" y1="4" x2="18" y2="56" stroke="#1a5c2a" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Flag pennant (triangle) -->
  <polygon points="18,6 54,16 18,28" fill="#1a5c2a"/>

  <!-- Red circle on flag -->
  <circle cx="33" cy="17" r="6.5" fill="#E21F2F"/>

  <!-- EAST QUEEN text -->
  <text x="62" y="28" font-family="'Arial Black', 'Arial', sans-serif" font-weight="900" font-size="20" fill="#1a5c2a" letter-spacing="0.5">EAST QUEEN</text>

  <!-- GROUP text (spaced) -->
  <text x="64" y="46" font-family="'Arial', sans-serif" font-weight="700" font-size="13" fill="#1a5c2a" letter-spacing="5">GROUP</text>
</svg>
